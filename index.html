<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>1 Year = 5 Years</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="outer">
  <div id="app">

    <header>
      <button onclick="showPage('todo')">To-Do</button>
      <button onclick="showPage('review')">Review</button>
      <button onclick="showPage('setup')">Setup</button>
    </header>

    <section id="todo" class="page"></section>
    <section id="review" class="page hidden"></section>

    <section id="setup" class="page hidden">
      <h2>Add / Edit Objective</h2>

      <input id="objName" placeholder="Objective name">
      <input id="objDeadline" type="date">

      <select id="objFreq">
        <option>Daily</option>
        <option>Weekly</option>
        <option>Monthly</option>
      </select>

      <div id="leverageInputs"></div>

      <button class="secondary" onclick="addLeverageInput()">+ Add Leverage</button>
      <button onclick="saveObjective()">Save Objective</button>
    </section>

  </div>
</div>

<script src="app.js"></script>
</body>
</html>
